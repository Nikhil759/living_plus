name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Real-model eval, only when the AI layer changes. Needs the GEMINI_API_KEY repository secret.
  saarthi-eval:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: ai
        with:
          filters: |
            changed:
              - 'backend/app/agents/**'
              - 'backend/app/rag/**'
              - 'backend/app/services/saarthi_*.py'
              - 'backend/evals/**'
              - 'backend/seed_data/society-guide/**'
      - if: steps.ai.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - if: steps.ai.outputs.changed == 'true'
        run: uv sync --locked
      - if: steps.ai.outputs.changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: https://ci.supabase.co
          FRONTEND_ORIGIN: http://localhost:3000
          REDIS_URL: redis://localhost:6379/0
        run: uv run python -m evals.run
      - if: always() && steps.ai.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-eval-report
          path: backend/evals/reports/
